apiVersion: apps/v1
kind: Deployment
metadata:
  name: almanac-dev
  namespace: internal-tooling-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: almanac-dev
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: 'true'
        vault.hashicorp.com/agent-pre-populate-only: 'true'
        vault.hashicorp.com/ca-cert: /run/secrets/kubernetes.io/serviceaccount/ca.crt
        vault.hashicorp.com/role: 'almanac-dev'
        vault.hashicorp.com/agent-inject-secret-almanac-dev: 'dev/almanac'
        vault.hashicorp.com/agent-inject-template-almanac-dev: |
          {{- with secret "dev/almanac" -}}
            export ALMANAC_API_KEY="{{ .Data.data.almanac_api_key }}""
          {{- end }}
      labels:
        app: almanac-dev
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10014
        runAsGroup: 10015
      imagePullSecrets:
        - name: almanac-registry-secret
      containers:
        - image: harbor.pscp-css.support/dev/almanac-dev:0.0.0
          imagePullPolicy: Always
          name: almanac-dev
          command: ['sh', '-c', 'source /vault/secrets/almanac && uvicorn almanac:app --host 0.0.0.0 --port 8444']
          ports:
            - containerPort: 8444
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              cpu: 500m
              memory: 1024Mi
            requests:
              cpu: 100m
              memory: 128Mi
      serviceAccountName: almanac-dev