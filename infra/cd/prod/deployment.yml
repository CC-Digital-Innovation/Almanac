apiVersion: apps/v1
kind: Deployment
metadata:
  name: almanac
  namespace: internal-tooling
spec:
  replicas: 1
  selector:
    matchLabels:
      app: almanac
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: 'true'
        vault.hashicorp.com/agent-pre-populate-only: 'true'
        vault.hashicorp.com/ca-cert: /run/secrets/kubernetes.io/serviceaccount/ca.crt
        vault.hashicorp.com/role: 'almanac'
        vault.hashicorp.com/agent-inject-secret-almanac: 'secret/almanac'
        vault.hashicorp.com/agent-inject-template-almanac: |
          {{- with secret "secret/almanac" -}}
            export API_KEY="{{ .Data.data.api_key }}""
          {{- end }}
      labels:
        app: almanac
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10014
        runAsGroup: 10015
      containers:
        - image: harbor.pscp-css.support/library/almanac:0.0.0
          name: almanac
          command: ['sh', '-c', 'source /vault/secrets/almanac && python -m uvicorn almanac:app --host 0.0.0.0 --port 8444']
          ports:
            - containerPort: 8444
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 500m
              memory: 1024Mi
            requests:
              cpu: 100m
              memory: 128Mi
      serviceAccountName: almanac